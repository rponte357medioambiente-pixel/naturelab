<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#843024" />
    <meta name="description" content="Cuaderno de campo para talleres de exploración ambiental. Funciona sin conexión y guarda los datos en el dispositivo." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NatureLab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="%BASE_URL%icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>NatureLab</title>
    <script>
      // Aplica la paleta y el tamaño de texto guardados antes de pintar, para que no parpadee.
      try {
        var apariencia = JSON.parse(localStorage.getItem('naturelab-apariencia') || '{}');
        document.documentElement.dataset.paleta = apariencia.paletaGeneral || 'atardecer';
        document.documentElement.dataset.texto = apariencia.texto || 'normal';
      } catch (e) {
        document.documentElement.dataset.paleta = 'atardecer';
      }
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <noscript>NatureLab necesita JavaScript activado.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
